models:
  M8_gr4j_daily:
    family: hydrological
    description: "GR4J modelo hidrológico diario lumped"
    status: future
    requires: [observed_streamflow_q_m3s, basin_area_km2, pet_daily_mm]
    target: q_m3s
    params:
      X1: [50, 100, 200, 500, 1000]   # Capacidad producción mm
      X2: [-3, -1, 0, 1, 2]           # Coef intercambio agua subterránea mm
      X3: [20, 50, 100, 200, 500]     # Capacidad enrutamiento 1 día mm
      X4: [1.0, 1.5, 2.0, 3.0, 5.0]  # Tiempo de base UH días
    calibration: SCE-UA
    objective: NSE
    note: "Requiere caudal observado ANA/SENAMHI. Pendiente."

  M9_gr2m_monthly:
    family: hydrological
    description: "GR2M modelo hidrológico mensual"
    status: future
    requires: [observed_streamflow_monthly, basin_area_km2, pet_monthly_mm]
    params:
      X1: [100, 200, 500, 1000]
      X2: [0.5, 0.7, 0.9, 1.1]
    note: "Requiere caudal observado mensual. Pendiente."
