# Configuración de features hidrometeorológicas

precipitation_lags:
  variable: pr_mm
  lags: [1, 2, 3, 5, 7, 10, 14, 21, 30]
  naming: "pr_lag_{lag}"

temperature_lags:
  variables: [tmax_c, tmin_c, tmean_c]
  lags: [1, 2, 3, 7]

rolling_windows:
  pr_sum:
    variable: pr_mm
    windows: [1, 3, 5, 7, 10, 15, 30]
    stat: sum
    naming: "pr_sum_{window}d"
  tmean_rolling:
    variable: tmean_c
    windows: [7, 14, 30]
    stat: mean

antecedent_precipitation_index:
  variable: pr_mm
  decay_k: 0.85  # Factor de decaimiento diario
  windows: [7, 15, 30]
  naming: "api_{window}d"

fourier_seasonality:
  orders: [1, 2]  # Sin y cos para anual y semianual
  period: 365.25
  features:
    - name: sin_doy_1
      formula: "sin(2*pi*doy/365.25)"
    - name: cos_doy_1
      formula: "cos(2*pi*doy/365.25)"
    - name: sin_doy_2
      formula: "sin(4*pi*doy/365.25)"
    - name: cos_doy_2
      formula: "cos(4*pi*doy/365.25)"

calendar:
  features:
    - day_of_year
    - month
    - week_of_year
    - hydro_month   # 1=octubre, ..., 12=septiembre
    - hydro_week
    - hydro_phase   # wet/dry/transition_onset/transition_end

hydrological_phases:
  # Cuenca andina peruana - Chancay-Huaral
  wet_season:
    months: [10, 11, 12, 1, 2, 3, 4]  # oct-abr
    label: "wet"
  dry_season:
    months: [5, 6, 7, 8, 9]  # may-sep
    label: "dry"
  transition_onset:  # Inicio de lluvias
    months: [10, 11]
    label: "transition_onset"
  transition_end:  # Fin de lluvias
    months: [4, 5]
    label: "transition_end"

pet_hargreaves:
  formula: "0.0023 * Ra * (Tmean + 17.8) * sqrt(max(Tmax - Tmin, 0))"
  note: "Ra = radiación extraterrestre en mm/día equivalente. Si no disponible, dejar NaN y documentar."
  requires_ra: true
  ra_method: "latitudinal_daily"  # Calcular Ra por latitud y día del año

climatology:
  aggregation: doy  # Climatología por día del año
  stat: [p10, p25, p50, p75, p90, mean]
  variables: [pr_mm, tmax_c, tmin_c, tmean_c]
  calibration_split: train
  naming: "clim_{variable}_{stat}_doy"
