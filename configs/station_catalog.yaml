# ================================================================
#  Catálogo de Estaciones - Cuenca Chancay-Huaral
#  Proyección: WGS84 (EPSG:4326) para coords; UTM 18S (EPSG:32718) para análisis espacial
#  Fuentes: SNIRH/ANA (descarga 18/05/2026), SENAMHI, literatura ANA 2014
# ================================================================

projection:
  geographic:  EPSG:4326    # WGS84 - almacenamiento de coordenadas
  projected:   EPSG:32718   # UTM Zona 18S - cálculos de distancia / área
  basin_utm_zone: 18S

# ──────────────────────────────────────────────────────────────────
# ESTACIONES HIDROMÉTRICAS (caudal / nivel)
# Fuente: SNIRH/ANA - descarga directa xlsx
# ──────────────────────────────────────────────────────────────────
hydrometrics:

  - id: santo_domingo_auto
    name: "Santo Domingo"
    code: "47E214D2"
    code_phisis: "PHISIS0137"
    type: "Automática / Hidromética"
    operator: "SENAMHI"
    lat: -11.3701
    lon: -77.0282
    alt_m: 614
    rio: "Río Chancay-Huaral"
    distrito: "Huaral"
    provincia: "Huaral"
    departamento: "Lima"
    ala: "Chancay Huaral"
    variables:
      - {name: "caudal_diario",    units: "m3/s", freq: "1D",  file_pattern: "*143819*"}
      - {name: "caudal_horario",   units: "m3/s", freq: "1H",  file_pattern: "*143815*"}
    period_approx: "2020-2026"
    quality: "primaria_sin_control"
    notes: >
      Estación principal para calibración GR4J y entrenamiento TFT.
      Lat/lon verificadas con SNIRH. Duplicada como PHISIS0137 (manual) en lat=-11.3836, lon=-77.0503.

  - id: santo_domingo_manual
    name: "Santo Domingo (Manual)"
    code: "PHISIS0137"
    type: "Convencional / Hidromética"
    operator: "SENAMHI"
    lat: -11.3836
    lon: -77.0503
    alt_m: null
    rio: "Río Chancay-Huaral"
    distrito: "Huaral"
    provincia: "Huaral"
    departamento: "Lima"
    ala: "Chancay Huaral"
    variables:
      - {name: "caudal_diario",  units: "m3/s", freq: "1D", file_pattern: "*143727*"}
      - {name: "nivel_diario",   units: "m",    freq: "1D", file_pattern: "*143759*"}
      - {name: "nivel_horario",  units: "m",    freq: "1H", file_pattern: "*143803*"}
      - {name: "caudal_horario", units: "m3/s", freq: "1H", file_pattern: "*143808*"}
    period_approx: "~2020-2026"
    quality: "primaria_sin_control"

  - id: puente_callantama
    name: "Puente Callantama"
    code: "47E22148"
    type: "Automática / Hidromética"
    operator: "SENAMHI"
    lat: -11.2989
    lon: -76.8518
    alt_m: 1378
    rio: "Río Chancay-Huaral"
    distrito: "Lampian"
    provincia: "Huaral"
    departamento: "Lima"
    ala: "Chancay Huaral"
    variables:
      - {name: "caudal_diario",  units: "m3/s", freq: "1D", file_pattern: "*143916*"}
      - {name: "caudal_horario", units: "m3/s", freq: "1H", file_pattern: "*143920*"}
    period_approx: "~2020-2026"
    quality: "primaria_sin_control"
    notes: "Estación intermedia. Alta resolución temporal (horaria)."

  - id: vichaycocha
    name: "Vichaycocha"
    code: "47E257D8"
