models:
  M5_random_forest:
    family: ml
    description: "Random Forest para pronóstico pluviométrico"
    targets: [pr_next_1d, pr_sum_next_3d, pr_sum_next_7d]
    n_trials: 5
    search_type: random
    params_grid:
      n_estimators: [100, 200, 300, 500]
      max_depth: [3, 4, 5, 6, null]
      min_samples_leaf: [5, 10, 20, 30]
      max_features: [0.5, 0.7, 1.0, sqrt]
      random_state: [42]

  M6_xgboost:
    family: ml
    description: "XGBoost para pronóstico pluviométrico"
    targets: [pr_next_1d, pr_sum_next_3d, pr_sum_next_7d]
    n_trials: 8
    search_type: random
    params_grid:
      n_estimators: [200, 400, 600, 800]
      max_depth: [2, 3, 4, 5]
      learning_rate: [0.01, 0.03, 0.05, 0.1]
      subsample: [0.7, 0.8, 0.9, 1.0]
      colsample_bytree: [0.7, 0.8, 0.9, 1.0]
      reg_alpha: [0, 0.1, 0.5]
      reg_lambda: [1, 2, 5]
      random_state: [42]

  M7_lightgbm:
    family: ml
    description: "LightGBM para pronóstico pluviométrico"
    targets: [pr_next_1d, pr_sum_next_3d, pr_sum_next_7d]
    n_trials: 8
    search_type: random
    params_grid:
      n_estimators: [200, 400, 600, 800]
      max_depth: [3, 4, 5, 6, -1]
      learning_rate: [0.01, 0.03, 0.05, 0.1]
      num_leaves: [15, 31, 63, 127]
      subsample: [0.7, 0.8, 0.9, 1.0]
      colsample_bytree: [0.7, 0.8, 0.9, 1.0]
      random_state: [42]
      verbosity: [-1]
